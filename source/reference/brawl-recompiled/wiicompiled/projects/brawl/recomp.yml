schema_version: 1
workspace_root: ../..

# Super Smash Bros. Brawl, North America (RSBE01 rev 2, WiiDS retarget; upstream used rev 1): main.dol. The game's .rel modules (files/module) are
# pre-linked at their load addresses separately (see tools/).
project:
  id: brawl-rsbe01
  display_name: Super Smash Bros. Brawl (USA)
  game_id: RSBE01
  region: E
  base_manifest_format: brawl-recomp-base-manifest
  base_manifest_stem: brawl_base

memory:
  base: 0x80000000
  size: 0x15800000  # MEM1 plus MEM2 through the module homes (0x94004000..0x95800000): the translator's image window
  sda_base: 0x805A4420
  sda2_base: 0x805A9320

inputs:
  dol:
    path: ../game/main_translate.dol  # main.dol plus the resident modules (tools/build_modules.py)
    sha256: 27e3afd3e877e64c84cad2de5f0c0b04fe338813aa7aea5d8b19b509b7ab2ac6  # rev 2 (upstream rev 1: b91ca3e6...)
  # All 126 files/module/*.rel, each pre-linked at its own home above the game's MEM2 arena, as one synthetic REL
  # (projects/brawl/tools/build_modules.py; hle/brawl_modules.cpp links them at run time).
  rel:
    path: ../game/brawl_modules.rel
    load_address: 0x94000000

translation:
  entry_points:
    - 0x8000403C
  # Function starts from the Brawl decompilation (doldecomp/brawl, config/RSBE01_02/symbols.txt). Its rev 2 layout
  # matches this rev 1 main.dol (every function end checked).
  function_map:
    path: projects/brawl/MAP_full.txt  # MAP.txt (main.dol) + MAP_modules.txt, written by build_modules.py
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/brawl_base_manifest.json
