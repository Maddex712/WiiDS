name: Bug report
description: Something looks, sounds, or behaves wrong (graphics, audio, controls, online, saving).
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: category
    attributes:
      label: What kind of bug?
      options:
        - Graphics / visual glitch
        - Audio
        - Touch controls
        - Controller / gamepad
        - Online (include the error code)
        - Settings or save data not kept
        - Setup (disc import, Retro Rewind install)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DriftDroid version
      description: Android Settings > Apps > DriftDroid shows it at the bottom.
      placeholder: "e.g. 1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / handheld model
      placeholder: "e.g. Galaxy S24 Ultra, Odin 2 Portal, Retroid Pocket 5"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Chip or GPU (if you know it)
      description: Helps a lot for graphics bugs. Search your model online if unsure.
      placeholder: "e.g. Snapdragon 8 Gen 2 / Adreno 740, Helio G85 / Mali-G52"
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "e.g. Android 14"
  - type: dropdown
    id: mode
    attributes:
      label: Which game?
      options:
        - Original Mario Kart Wii
        - Retro Rewind
        - Both
        - Doesn't get that far
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Start a VS race on ...
        2. ...
  - type: textarea
    id: media
    attributes:
      label: Screenshot / video
      description: Drag images or clips here. Very helpful for visual bugs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In DriftDroid's start screen, tap **Export Diagnostics** and drag the zip file here.
        This is the single most useful thing you can attach.
