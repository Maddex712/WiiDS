name: Performance problem
description: Low FPS, stutter, or overheating.
title: "[Performance] "
labels: ["performance"]
body:
  - type: input
    id: version
    attributes:
      label: DriftDroid version
      description: Android Settings > Apps > DriftDroid shows it at the bottom.
      placeholder: "e.g. 1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / handheld model
      placeholder: "e.g. Galaxy S24 Ultra, Odin 2 Portal, Retroid Pocket 5"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Chip or GPU (if you know it)
      description: Helps a lot for graphics bugs. Search your model online if unsure.
      placeholder: "e.g. Snapdragon 8 Gen 2 / Adreno 740, Helio G85 / Mali-G52"
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "e.g. Android 14"
  - type: dropdown
    id: mode
    attributes:
      label: Which game?
      options:
        - Original Mario Kart Wii
        - Retro Rewind
        - Both
        - Doesn't get that far
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: FPS you see
      placeholder: "e.g. 30-40 in races, 60 in menus"
  - type: input
    id: settings
    attributes:
      label: Resolution setting and phone power mode
      description: Many phones have a "Performance" or "High performance" mode that makes a big difference.
      placeholder: "e.g. 1x resolution, balanced power mode"
  - type: textarea
    id: where
    attributes:
      label: Where is it slow?
      description: Specific tracks, menus, number of CPU racers, only after a while (heat)?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In DriftDroid's start screen, tap **Export Diagnostics** and drag the zip file here.
        This is the single most useful thing you can attach.
