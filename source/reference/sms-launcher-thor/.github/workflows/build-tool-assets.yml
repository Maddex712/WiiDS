name: Publish build tool archives
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Tool archive to publish
        type: choice
        default: all
        options: [all, linux, win32]
      reuse_run:
        description: Optional previous run containing prepared tool archives to reverify
        type: string
        default: ""
      verified_run:
        description: Optional previous run with a successful compile check; retry publication only
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  prepare-tools:
    if: inputs.verified_run == ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux' && '[{"os":"ubuntu-22.04","platform":"linux"}]' || inputs.platform == 'win32' && '[{"os":"windows-2025","platform":"win32"}]' || '[{"os":"ubuntu-22.04","platform":"linux"},{"os":"windows-2025","platform":"win32"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform)
      - uses: actions/setup-node@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
      - name: Prepare tool archives and corresponding sources
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && inputs.reuse_run == ''
        run: node scripts/package-build-tools.js
      - name: Reuse prepared archives
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.platform }}
          path: tool-assets
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize retained Linux archive headers
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && matrix.platform == 'linux' && inputs.reuse_run != ''
        run: node scripts/normalize-linux-tool-archive.js
      - name: Compile with the relocated archive
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: node scripts/smoke-build-tools.js
        env:
          SMS_TOOL_ASSET_MANIFEST: tool-assets/manifest-${{ matrix.platform }}.json
      - name: Compile and start Eclipse with the relocated archive
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: node scripts/smoke-eclipse.js
        env:
          SMS_TOOL_ASSET_MANIFEST: tool-assets/manifest-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        # Retain prepared archives for diagnosis/reverification if smoke fails.
        # The publish job still requires successful preparation and smoke.
        if: always() && (inputs.platform == 'all' || inputs.platform == matrix.platform)
        with:
          name: tools-${{ matrix.platform }}
          path: tool-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: prepare-tools
    if: always() && (inputs.verified_run != '' || needs.prepare-tools.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify previous compilation before retrying publication
        if: inputs.verified_run != ''
        run: node scripts/verify-tool-run.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMS_VERIFIED_RUN: ${{ inputs.verified_run }}
          SMS_VERIFIED_PLATFORM: ${{ inputs.platform }}
      - uses: actions/download-artifact@v4
        if: inputs.verified_run == ''
        with:
          path: tool-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.verified_run != ''
        with:
          pattern: ${{ inputs.platform == 'all' && 'tools-*' || format('tools-{0}', inputs.platform) }}
          path: tool-assets
          merge-multiple: true
          run-id: ${{ inputs.verified_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable toolset release
        run: node scripts/publish-tool-assets.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
