plugins { id 'com.android.application' }

def portRoot = file(providers.gradleProperty('smsPortRoot').getOrElse('../../../sms-port'))
def sdlRoot = file(providers.gradleProperty('smsSdlRoot').getOrElse("${portRoot}/build/deps/SDL2-2.32.10"))
def launcherPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def versionParts = launcherPackage.version.tokenize('.').collect { it as int }
def previewBuild = providers.gradleProperty('smsAndroidPreview').getOrElse('0').toInteger()
if (previewBuild < 0 || previewBuild > 99)
    throw new GradleException('smsAndroidPreview must be between 0 and 99')
def sourceRevision = { File root ->
    if (!new File(root, '.git').exists()) return 'unknown'
    def revision = providers.exec {
        workingDir root
        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
        ignoreExitValue true
    }.standardOutput.asText.get().trim()
    if (!revision) return 'unknown'
    def dirty = providers.exec {
        workingDir root
        commandLine 'git', 'diff', '--quiet', 'HEAD', '--'
        ignoreExitValue true
    }.result.get().exitValue != 0
    return revision + (dirty ? '-modified' : '')
}
def launcherRevision = sourceRevision(file('../..'))
def gameRevision = sourceRevision(portRoot)

// WiiDS release signing: a private key described outside every repository. Without it (any other
// machine) release builds fall back to the debug key so they still build and install.
def wiidsKeystoreFile = new File(System.getProperty('user.home'), '.wiids-release/keystore.properties')
def wiidsKeystore = null
if (wiidsKeystoreFile.isFile()) {
    wiidsKeystore = new Properties()
    wiidsKeystoreFile.withInputStream { wiidsKeystore.load(it) }
}

android {
    namespace 'dev.chasem.smslauncher'
    compileSdk 34
    ndkVersion '29.0.14206865'
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.wither.sms.eclipse.thor'
        minSdk 29
        targetSdk 34
        versionCode project.hasProperty('wiidsVersionCode') ? project.property('wiidsVersionCode') as int : versionParts[0] * 1000000 + versionParts[1] * 10000 + versionParts[2] * 100 + previewBuild
        versionName project.hasProperty('wiidsVersionName') ? project.property('wiidsVersionName') : launcherPackage.version + '-android' + (previewBuild ? "-preview.${previewBuild}" : '')
        buildConfigField 'String', 'LAUNCHER_REVISION', groovy.json.JsonOutput.toJson(launcherRevision)
        buildConfigField 'String', 'GAME_REVISION', groovy.json.JsonOutput.toJson(gameRevision)
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdlRoot}/android-project/app/src/main/java"
            jniLibs.srcDirs = [providers.gradleProperty('smsNativeLibs').getOrElse('../../../../build/eclipse-thor/jniLibs')]
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    signingConfigs {
        if (wiidsKeystore != null) {
            wiids {
                storeFile file(wiidsKeystore.getProperty('storeFile'))
                storePassword wiidsKeystore.getProperty('storePassword')
                keyAlias wiidsKeystore.getProperty('keyAlias')
                keyPassword wiidsKeystore.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig wiidsKeystore != null ? signingConfigs.wiids : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig wiidsKeystore != null ? signingConfigs.wiids : signingConfigs.debug
        }
    }
}
