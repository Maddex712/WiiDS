# New Super Mario Bros. Wii, North America rev 1 (SMNE01 v1).
# Thor clean-disc profile: Redump whole-disc SHA1 aa7b134a7606435ddcd735f2964ebdecde38c2ef.
# Overrides the upstream input assumption 6d755ec24c395fee600a856a85785e0e99c0b7ecb680d573a6cdd1aa6f7beee7.
# Translate this exact clean DOL again; upstream generated output is not reusable.
# The four boot RELs are pre-linked offline by E:\NSMBWPort\tools\prelink_rels.py into one
# synthetic REL whose image starts at d_profileNP's heap address (see nsmbw_rel_layout.json).
project:
  id: nsmbw-smne01
  display_name: New Super Mario Bros. Wii (USA rev 1)
  game_id: SMNE01
  region: E
  base_manifest_format: nsmbw-recomp-base-manifest
  base_manifest_stem: nsmbw_base

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8042F680
  sda2_base: 0x80433080

inputs:
  dol:
    path: ../game/main.dol
    sha256: 166eb6b7cca21418e316a6cfbf1bfbf0a213eb8f6396d42126a1482bb764a955
  rel:
    path: ../game/nsmbw_linked.rel
    load_address: 0x807684C0

translation:
  entry_points:
    - 0x80004050
  # Generated by E:\NSMBWPort\tools\build_function_map.py (bl targets, data/code pointers, PAL symbols mapped to E1).
  function_map:
    path: projects/nsmbw/MAP.txt
  allow_unsupported_instructions: false

runtime:
  # The runtime under runtime/src is retargeted to NSMBW SMNE01 rev 1 (branch nsmbw).
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  # runtime/CMakeLists.txt reads ../generated/build_shards/shards.cmake, so build in-tree.
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/nsmbw_base_manifest.json



